name: sandwich_shop
description: "A Flutter project for a sandwich shop."
publish_to: none
version: 1.0.0+1
environment:
  sdk: ">=2.17.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.0
  sqflite_common_ffi: ">=2.3.4"
  sqflite_common_ffi_web: ">=0.4.3"
  path: ">=1.9.0"
dependency_overrides:
  sqlite3: 3.5.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/data/
