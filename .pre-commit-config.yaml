repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.41.0
    hooks:
      - id: markdownlint
        args: ["--config", ".markdownlint.json"]

  - repo: https://github.com/streetsidesoftware/cspell-cli
    rev: v8.8.0
    hooks:
      - id: cspell
        args: ["--locale", "en-GB", "--config", "cspell.json"]

  - repo: local
    hooks:
      - id: vale
        name: vale
        description: >-
          Enforce the worksheet writing style with Vale. Scoped to the files
          that have been migrated to the house style; add worksheets here as
          they are revised.
        entry: vale
        language: system
        files: ^(worksheet-1\.md|worksheet-2\.md|README\.md)$
        require_serial: true
