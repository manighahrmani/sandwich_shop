# Third-party vendored content (awesome-copilot skills) is not linted.
exclude: ^\.github/skills/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.41.0
    hooks:
      - id: markdownlint
        args: ["--config", ".markdownlint.json"]

  - repo: https://github.com/streetsidesoftware/cspell-cli
    rev: v8.8.0
    hooks:
      - id: cspell
        args: ["--locale", "en-GB", "--config", "cspell.json"]

  - repo: local
    hooks:
      - id: no-emoji
        name: no-emoji
        entry: python scripts/check_no_emoji.py
        language: python
        types: [text]
        # TODO: worksheet-2.md exercise builds sandwich-emoji output; decide whether
        # to redesign it before removing this exclusion.
        exclude: ^worksheet-2\.md$
