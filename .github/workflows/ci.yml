name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-spellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install cspell and markdownlint
        run: npm install -g cspell markdownlint-cli

      - name: Spell check (British English)
        run: cspell "**/*.md" "**/*.dart" --locale en-GB --config cspell.json

      - name: Lint Markdown
        run: markdownlint "**/*.md" --config .markdownlint.json

  dart-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Check Dart formatting
        run: dart format --set-exit-if-changed .

      - name: Analyse Dart code
        run: flutter analyze

      - name: Run tests
        run: flutter test
