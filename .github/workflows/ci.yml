name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run pre-commit hooks
        run: pre-commit run --all-files

  dart-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check for pubspec.yaml
        id: check_pubspec
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Flutter
        if: steps.check_pubspec.outputs.exists == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable
      - name: Install dependencies
        if: steps.check_pubspec.outputs.exists == 'true'
        run: flutter pub get
      - name: Check Dart formatting
        if: steps.check_pubspec.outputs.exists == 'true'
        run: dart format --set-exit-if-changed .
      - name: Analyse Dart code
        if: steps.check_pubspec.outputs.exists == 'true'
        run: flutter analyze
      - name: Run tests
        if: steps.check_pubspec.outputs.exists == 'true'
        run: flutter test

  link-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --accept 200,201,202,203,204,206,301,302,303,304,307,308,403,429,999
            "**/*.md"
          fail: true
