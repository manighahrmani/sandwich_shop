name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run pre-commit hooks
        run: pre-commit run --all-files

  dart-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check for pubspec.yaml
        id: check_pubspec
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Flutter
        if: steps.check_pubspec.outputs.exists == 'true'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.x"
          channel: stable
      - name: Install dependencies
        if: steps.check_pubspec.outputs.exists == 'true'
        run: flutter pub get
      - name: Check Dart formatting
        if: steps.check_pubspec.outputs.exists == 'true'
        run: dart format --set-exit-if-changed .
      - name: Analyse Dart code
        if: steps.check_pubspec.outputs.exists == 'true'
        run: flutter analyze
      - name: Run tests
        if: steps.check_pubspec.outputs.exists == 'true'
        run: flutter test

  link-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check markdown links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --accept 200,201,202,203,204,206,301,302,303,304,307,308,403,429,999
            "**/*.md"
          # TODO(#23): flip to true once the pre-existing broken links are fixed
          fail: false
