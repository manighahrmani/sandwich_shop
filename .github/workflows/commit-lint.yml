name: Commit Message Lint

on:
  pull_request:
    branches: [main]

jobs:
  commitlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commit messages
        shell: bash
        run: |
          pattern='^(feat|fix|docs|style|refactor|test|chore|ci)(\([a-z][a-z0-9-]*\))?: .{1,72}$'
          failed=0

          while IFS= read -r msg; do
            [[ -z "$msg" ]] && continue
            if ! grep -qE "$pattern" <<< "$msg"; then
              echo "INVALID: $msg"
              failed=1
            fi
          done < <(git log --format='%s' "origin/${{ github.base_ref }}..HEAD")

          if (( failed )); then
            echo ""
            echo "Commit messages must follow Conventional Commits:"
            echo "  type(scope): subject  (max 72 chars)"
            echo "  Types: feat fix docs style refactor test chore ci"
            exit 1
          fi
          echo "All commit messages are valid."
